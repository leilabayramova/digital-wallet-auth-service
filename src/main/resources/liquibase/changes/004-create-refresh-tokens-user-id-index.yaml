databaseChangeLog:
  - changeSet:
      id: 004-create-refresh-tokens-user-id-index
      author: leila

      changes:
        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
            columns:
              - column:
                  name: expires_at

      rollback:
        - dropIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_expires_at
        - dropIndex:
            tableName: refresh_tokens
            indexName: idx_refresh_tokens_user_id
